contrato: 1
nome: bulk-extractor
titulo: Vestígios no conteúdo do disco
versao: "2.2.0"
ferramenta: bulk-extractor
# Le o disco inteiro byte a byte: levou 72 de 152 minutos em um disco de 50 GB.
opcional: true
reconhece:
  - tipo: disco
    magica_hex: "455646090d0aff00"
    extensoes: [.dd, .e01, .001, .002, .003, .004, .005, .006, .007, .008, .009, .010, .011, .012]
consome: [disco]
modo: imagem
instalar:
  windows-amd64:
    url: https://github.com/simsong/bulk_extractor/releases/download/v2.2.0/bulk_extractor64.exe
    sha256: dfcc678ee3b7da111e8fba6259c4e842ffffcbe42dd96e6c6e6cc238d74bd911
    arquivo: bulk_extractor64.exe
comando:
  windows:
    exec: bulk_extractor64.exe
    # Sem recuperar executaveis e pacotes: o exame nao usa esses arquivos, e malware real gravado em disco so provoca o antivirus.
    args: [-S, evtx_carved_carve_mode=0, -S, jpeg_carve_mode=0, -S, kml_carved_carve_mode=0, -S, ntfsindx_carved_carve_mode=0, -S, ntfslogfile_carved_carve_mode=0, -S, ntfsmft_carved_carve_mode=0, -S, ntfsusn_carved_carve_mode=0, -S, rar_carve_mode=0, -S, rtti_carve_mode=0, -S, sqlite_carved_carve_mode=0, -S, unrar_carved_carve_mode=0, -S, utmp_carved_carve_mode=0, -S, vcard_carve_mode=0, -S, winpe_carved_carve_mode=0, -S, zip_carved_carve_mode=0, -o, "{saida}/vestigios", "{entrada}"]
saida:
  arquivos: vestigios/*.txt
  # Listas pequenas e de alto valor. As demais ficam preservadas na saida bruta.
  somente: [email, ccn, ip, telephone]
  # Pacotes de rede achados no disco seguem para os modulos de rede.
  derivar: [vestigios/packets.pcap]
  formato: tsv
  colunas: [local, valor, contexto]
  mapas:
    - tipo: evento
      fonte: "Conteúdo do disco: {_arquivo}"
      descricao: "{_arquivo}: {valor}"
      origem_local: "{local}"
      entidades:
        - {tipo: "{_arquivo}", valor: "{valor}"}
