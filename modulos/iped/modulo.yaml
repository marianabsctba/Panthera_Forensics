contrato: 1
nome: iped
titulo: Exame profundo do conteúdo
versao: "4.3.1"
# Pesado: 1,1 GB instalado, e mais 700 MB em cada caso, que leva uma copia do programa.
opcional: true
reconhece:
  - tipo: disco
    magica_hex: "455646090d0aff00"
    extensoes: [.dd, .e01, .001, .002, .003, .004, .005, .006, .007, .008, .009, .010, .011, .012]
  # So pela extensao: docx e outros formatos tambem comecam como um zip.
  - tipo: pacote
    extensoes: [.zip]
consome: [disco, pacote]
modo: imagem
instalar:
  windows-amd64:
    url: https://github.com/sepinf-inc/IPED/releases/download/4.3.1/IPED-4.3.1_and_java_plugins.zip
    sha256: e8ee71e7e2e41a770b521bfbaabf0cf0b88add5febff27c5a5ad375248cfef8e
comando:
  windows:
    exec: iped-4.3.1/jre/bin/java.exe
    dir: ferramenta
    # UTC fixo: no fuso local, as datas saem com abreviacoes ambiguas, como BRST. Sem
    # --downloadInternetData, de proposito: o exame nao pode fazer contato externo.
    args: [-Duser.timezone=UTC, -Duser.language=en, -jar, "{ferramenta}/iped-4.3.1/iped.jar", -d, "{entrada}", -o, "{saida}/exame", --nogui, --nologfile]
    # E-mails, historico e o banco da busca do Windows ficam dentro do indice, fora da lista.
    depois:
      exec: iped-4.3.1/jre/bin/java.exe
      args: [-Dnashorn.args=--no-deprecation-warning, -cp, "{ferramenta}/iped-4.3.1/lib/lucene-core-9.2.0.jar;{ferramenta}/iped-4.3.1/lib/sqlite-jdbc-3.41.2.2.jar", jdk.nashorn.tools.Shell, -scripting, "{regras}/iped/itens.js", --, "{saida}/exame", "{saida}"]
# A busca no conteudo roda sem abrir a interface da ferramenta: tudo aparece na nossa tela.
consulta:
  exec: iped-4.3.1/jre/bin/java.exe
  args: [-Dnashorn.args=--no-deprecation-warning, -cp, "{ferramenta}/iped-4.3.1/lib/lucene-core-9.2.0.jar", jdk.nashorn.tools.Shell, -scripting, "{regras}/iped/consulta.js", --, "{saida}/exame/iped/index", "{limite}", "{termos}"]
saida:
  arquivos: exame/FileList.csv
  formato: csv
  mapas:
    - tipo: evento
      manter_sem_data: true
      quando: "{Modified}"
      fonte: "Exame profundo: {Category}"
      descricao: "{Path}"
      origem_local: "{TrackId}"
      entidades:
        - {tipo: arquivo, valor: "{Name}"}
    # Tamanho zero e marcado como apagado costuma ser so um nome que sobrou no diretorio: no
    # DFR-01 do NIST, isso aparece para um arquivo que continua ativo.
    - tipo: evento
      se: {Deleted: "true", Size: "0"}
      manter_sem_data: true
      quando: "{Modified}"
      fonte: "Exame profundo: nomes residuais"
      descricao: "Nome residual ou arquivo vazio, não confirma exclusão: {Path}"
      origem_local: "{TrackId}"
    # Esta marca nao separa entrada reaproveitada: no Hacking Case do NIST, 92 de 94 itens
    # com conteudo estavam realocados segundo o The Sleuth Kit, entao tamanho e hash podem
    # ser de outro arquivo. A leitura de disco e que distingue os dois casos.
    - tipo: evento
      se: {Deleted: "true"}
      se_nao: {Size: "0"}
      manter_sem_data: true
      quando: "{Modified}"
      fonte: "Exame profundo: apagados"
      descricao: "Marcado como apagado; confira se a entrada não foi reaproveitada por outro arquivo: {Path}"
      origem_local: "{TrackId}"
    - tipo: evento
      se: {Carved: "true"}
      manter_sem_data: true
      fonte: "Exame profundo: recuperados"
      descricao: "Arquivo recuperado do espaço livre: {Path}"
      origem_local: "{TrackId}"
  adicionais:
    - arquivos: mensagens.jsonl
      formato: jsonl
      mapas:
        - tipo: evento
          manter_sem_data: true
          quando: "{data}"
          fonte: E-mail
          descricao: "E-mail ({situacao}, pasta {pasta}) de {de} para {para}: {assunto}. {corpo} {anexos}"
          origem_local: "{caminho}"
          entidades:
            - {tipo: email, valor: "{remetente}"}
    - arquivos: historico.jsonl
      formato: jsonl
      mapas:
        # Visited e o historico de fato. O resto dos enderecos vem do cache e de recursos das
        # paginas, o que nao significa que a pessoa abriu cada um.
        - tipo: evento
          se_regex: {url: '^Visited: '}
          manter_sem_data: true
          quando: "{visita}"
          fonte: Histórico do Internet Explorer
          descricao: "{url}"
          origem_local: "{caminho}"
          entidades:
            - {tipo: url, valor: "{url}", remover: '^Visited: [^@]*@|[?#].*$'}
        - tipo: evento
          se_regex: {url: '^https?://'}
          manter_sem_data: true
          quando: "{visita}"
          fonte: Cache do Internet Explorer
          descricao: "{url}"
          origem_local: "{caminho}"
    - arquivos: busca-windows.jsonl
      formato: jsonl
      mapas:
        - tipo: evento
          se_regex: {Microsoft_IE_TargetUrl: .}
          manter_sem_data: true
          quando: "{System_DateModified}"
          fonte: Busca do Windows
          descricao: "Página no índice da busca: {Microsoft_IE_TargetUrl} {Microsoft_IE_Title}"
          origem_local: "DocID {DocID}"
        - tipo: evento
          se_regex: {System_Subject: .}
          se: {System_IsAttachment: "false"}
          manter_sem_data: true
          quando: "{System_Message_DateSent}"
          fonte: Busca do Windows
          descricao: "E-mail no índice da busca: {System_Message_FromName} para {System_Message_ToName}: {System_Subject}. {System_Search_AutoSummary} {System_Message_AttachmentNames}"
          origem_local: "DocID {DocID}"
        - tipo: evento
          se: {System_Search_Store: file}
          manter_sem_data: true
          quando: "{System_DateModified}"
          fonte: Busca do Windows
          descricao: "Arquivo no índice da busca: {System_ItemPathDisplay}"
          origem_local: "DocID {DocID}"
        - tipo: evento
          se: {System_Search_Store: StickyNotes}
          manter_sem_data: true
          quando: "{System_DateModified}"
          fonte: Busca do Windows
          descricao: "Nota no índice da busca: {System_ItemPathDisplay} {System_Search_AutoSummary}"
          origem_local: "DocID {DocID}"
