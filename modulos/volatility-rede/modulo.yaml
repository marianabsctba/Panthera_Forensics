contrato: 1
nome: volatility-rede
titulo: Conexões na memória
versao: "2.28.2"
ferramenta: volatility
reconhece:
  - tipo: memoria
    extensoes: [.mem, .vmem]
consome: [memoria]
instalar:
  windows-amd64:
    url: https://github.com/volatilityfoundation/volatility3/releases/download/v2.28.2/volatility3-win-exes-2.28.2.zip
    sha256: 7ccd2394589bf15d88fb20b242157b93771bce26c0b3aafbba8f2c168a337fa5
comando:
  windows:
    exec: vol.exe
    stdout: rede.jsonl
    args: [-q, -r, jsonl, -f, "{entrada}", windows.netscan]
saida:
  arquivos: rede.jsonl
  formato: jsonl
  mapas:
    - tipo: evento
      manter_sem_data: true
      quando: "{Created}"
      fonte: Memória
      descricao: "Conexão {Proto}: {LocalAddr}:{LocalPort} para {ForeignAddr}:{ForeignPort} ({State}), processo {Owner}"
      entidades:
        - {tipo: ip, valor: "{ForeignAddr}"}
        - {tipo: arquivo, valor: "{Owner}"}
