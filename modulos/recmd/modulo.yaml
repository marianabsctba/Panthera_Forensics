contrato: 1
nome: recmd
titulo: Leitura do Registro do Windows
versao: "2026-10-29"
reconhece:
  - tipo: registro
    magica_hex: "72656766"
consome: [registro]
instalar:
  windows-amd64:
    url: https://download.ericzimmermanstools.com/RECmd.zip
    sha256: a3d60621d4be6719693cd509e2802ee59a8e89971e23cc74434a6f4242841dfc
comando:
  windows:
    exec: RECmd/RECmd.exe
    args: [-f, "{entrada}", --bn, "{regras}/recmd/panthera.reb", --csv, "{saida}", --csvf, registro.csv]
saida:
  arquivos: "*registro*.csv"
  formato: csv
  legivel: [ValueData]
  mapas:
    - tipo: evento
      se: {Description: Primary Domain}
      quando: "{LastWriteTimestamp}"
      fonte: "Registro: {Category}"
      descricao: "Domínio primário: {ValueData_legivel}"
      origem_local: "{KeyPath}"
      entidades:
        - {tipo: dominio-windows, valor: "{ValueData_legivel}"}
    - tipo: evento
      manter_sem_data: true
      quando: "{LastWriteTimestamp}"
      fonte: "Registro: {Category}"
      descricao: "{Description}: {ValueName} = {ValueData} {ValueData2}"
      origem_local: "{KeyPath}"
      entidades:
        # O fuso da maquina permite mostrar cada data no horario local dela.
        - {tipo: fuso, valor: "{ValueData}", se: {ValueName: StandardName}}
        - {tipo: host, valor: "{ValueData}", se: {ValueName: ComputerName}}
        - {tipo: usuario, valor: "{ValueData}", se: {ValueName: DefaultUserName}}
        - {tipo: usuario, valor: "{ValueData}", se: {Description: User Accounts (SAM), ValueName: V}, remover: '^Username: | Id: .*$'}
